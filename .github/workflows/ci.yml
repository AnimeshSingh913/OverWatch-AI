name: CI/CD Pipeline - OverWatch AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-check:
    name: Backend Dependency & Import Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -c "import nltk; nltk.download('vader_lexicon')"

      - name: Verify backend imports
        run: |
          python -c "
          from backend.app import app
          from backend.experiment_tracker import EXPERIMENT_TRACKER
          print('✓ All backend modules import successfully')
          "

      - name: Verify FastAPI app starts
        run: |
          python -c "
          from backend.app import app
          routes = [r.path for r in app.routes]
          assert '/analyze' in routes, '/analyze route missing'
          assert '/simulate' in routes, '/simulate route missing'
          assert '/health' in routes, '/health route missing'
          print('✓ Routes verified:', routes)
          "

  frontend-check:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit
